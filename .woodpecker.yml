when:
  branch:
  - main
  event:
  - push

steps:
- name: test
  image: ghcr.io/astral-sh/uv:bookworm-slim
  commands:
      # Install WeasyPrint system dependencies
  - apt-get update && apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info && rm -rf /var/lib/apt/lists/*

      # Install Python and dependencies
  - uv python install
  - uv sync

      # Run tests
  - uv run pytest tests/ -n auto --reuse-db --cov --cov-report=term-missing --cov-fail-under=100
  environment:
    SECRET_KEY: test-secret-key-for-ci
    DEBUG: true
    ADMIN_EMAIL: admin@test.local
    MAILGUN_API_KEY: test-mailgun-key
    MAILGUN_API_URL: https://api.mailgun.net/v3
    MAILGUN_SENDER_DOMAIN: mg.test.local

- name: notify-telegram
  image: curlimages/curl:latest
  when:
  - status: [failure]
    event: [push]
  commands:
  - |
    printf 'CI FAILED [%s] branch: %s\nCommit: %s\nLink: %s' \
      "${CI_REPO_NAME}" "${CI_COMMIT_BRANCH}" "${CI_COMMIT_MESSAGE}" "${CI_PIPELINE_URL}" \
      > /tmp/msg.txt
    curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
      --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
      --data-urlencode "text@/tmp/msg.txt"
  environment:
    TELEGRAM_BOT_TOKEN:
      from_secret: telegram_bot_token
    TELEGRAM_CHAT_ID:
      from_secret: telegram_chat_id
