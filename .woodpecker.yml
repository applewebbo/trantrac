when:
  branch:
  - main

steps:
- name: test
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  commands:
      # Install dependencies
  - uv sync

      # Run tests
  - uv run pytest tests/ --cov --cov-report=term-missing
  environment:
    SECRET_KEY: test-secret-key-for-ci
    DEBUG: true
