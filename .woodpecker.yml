when:
  branch:
  - main

steps:
- name: test
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  commands:
      # Install WeasyPrint system dependencies
  - apt-get update && apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info && rm -rf /var/lib/apt/lists/*

      # Install dependencies
  - uv sync

      # Run tests
  - uv run pytest tests/ --cov --cov-report=term-missing
  environment:
    SECRET_KEY: test-secret-key-for-ci
    DEBUG: true
    ADMIN_EMAIL: admin@test.local
    MAILGUN_API_KEY: test-mailgun-key
    MAILGUN_API_URL: https://api.mailgun.net/v3
    MAILGUN_SENDER_DOMAIN: mg.test.local

- name: notify-telegram
  image: curlimages/curl:latest
  when:
  - status: [failure]
  commands:
  - |
    curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}&text=CI+FAILED+%5B${CI_REPO_NAME}%5D+branch%3A+${CI_COMMIT_BRANCH}%0ACommit%3A+${CI_COMMIT_MESSAGE}%0ALink%3A+${CI_PIPELINE_URL}"
  environment:
    TELEGRAM_BOT_TOKEN:
      from_secret: telegram_bot_token
    TELEGRAM_CHAT_ID:
      from_secret: telegram_chat_id
