[dependency-groups]
dev = [
  "ruff>=0.9.2",
  "pytest>=8.3.4",
  "pytest-django>=4.9.0",
  "pytest-xdist>=3.6.1",
  "pytest-cov>=6.0.0",
  "django-test-plus>=2.2.4",
  "factory-boy>=3.3.3",
  "pytest-asyncio>=1.3.0"
]
prod = [
  "granian[pname]>=1.7.6",
  "whitenoise>=6.9.0"
]

[project]
dependencies = [
  "crispy-tailwind>=1.0.3",
  "django>=5.1.5",
  "django-allauth>=65.3.1",
  "django-anymail[mailgun]>=12.0",
  "django-browser-reload>=1.17.0",
  "django-crispy-forms>=2.3",
  "django-environ>=0.12.0",
  "django-htmx>=1.21.0",
  "django-invitations>=2.1.0",
  "django-pwa>=2.0.1",
  "django-tailwind-cli[django-extensions]>=2.21.1",
  "google-api-python-client>=2.159.0",
  "google-auth>=2.37.0",
  "heroicons[django]>=2.10.0",
  "pillow>=12.1.0",
  "python-telegram-bot[webhooks]>=22.6",
  "rapidfuzz>=3.14.3",
  "uvloop>=0.21.0",
  "weasyprint>=68.1"
]
description = "Transaction to Google Sheets"
name = "trantrac"
readme = "README.md"
requires-python = ">=3.14"
version = "2026.5"

[tool.bandit]
exclude_dirs = []
skips = ["B101", "B106"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "def __str__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod"
]
precision = 2
show_missing = true

[tool.coverage.run]
branch = true
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/__pycache__/*",
  "*/venv/*",
  "*/.venv/*",
  "manage.py",
  "*/asgi.py",
  "*/wsgi.py",
  "*/settings/*",
  "users/views.py",
  "telegram_bot/handlers/*",
  "telegram_bot/views.py",
  "telegram_bot/management/commands/*"
]
source = ["."]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
addopts = [
  "--reuse-db",
  "--cov=.",
  "--cov-report=html",
  "--cov-report=term-missing",
  "--cov-config=pyproject.toml",
  "--strict-markers",
  "--no-migrations"
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests"
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"

# Django ORM attributes (objects, DoesNotExist, etc.) are not yet understood by ty.
# Suppress unresolved-attribute in Django app code until ty gains Django support.
[[tool.ty.overrides]]
include = ["trantrac/**", "telegram_bot/**", "users/**", "tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.ty.rules]
missing-argument = "warn"
unknown-argument = "warn"
unresolved-attribute = "warn"

[tool.ty.src]
exclude = [
  "**/migrations/**",
  "manage.py",
  "**/settings/**",
  "core/settings.py"
]

[tool.uv]
python-preference = "only-managed"
