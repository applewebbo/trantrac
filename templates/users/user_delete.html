{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-4">
    <h1 class="mb-4 text-2xl font-bold">Conferma eliminazione account</h1>
    <p class="mb-4">Sei sicuro di voler eliminare il tuo account? Questa azione è irreversibile.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-error">Elimina Account</button>
        <a href="{% url 'index' %}" class="btn btn-secondary ml-2">Annulla</a>
    </form>
</div>
{% endblock content %}
