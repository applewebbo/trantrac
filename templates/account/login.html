{% extends "base-simplified.html" %}
{% load account crispy_forms_tags i18n static %}
{% block content %}
    <div class="mx-auto my-8 max-w-sm">
        <h1 class="text-primary text-center text-3xl leading-tight font-medium tracking-tight md:text-2xl">
            <span class="font-thin italic">Tran</span>Trac
        </h1>
        <form class="space-y-4 md:space-y-6"
              method="post"
              action="{% url 'account_login' %}">
            {% csrf_token %}
            {{ form|crispy }}
            {% if redirect_field_value %}
                <input type="hidden"
                       name="{{ redirect_field_name }}"
                       value="{{ redirect_field_value }}" />
            {% endif %}
            <div class="mb-3 text-right text-sm">
                <a href="{% url 'account_reset_password' %}"
                   class="link link-primary">{% translate "Forgot Password?" %}</a>
            </div>
            <button type="submit" class="btn btn-primary w-full">{% translate "Sign In" %}</button>
        </form>
    </div>
{% endblock content %}
