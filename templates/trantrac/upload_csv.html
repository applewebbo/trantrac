{% load crispy_forms_tags %}
<div class="container mx-auto my-8 max-w-screen-sm">
    <div class="relative">
        <div id="spinner"
                class="htmx-indicator bg-base-100/70 pointer-events-none absolute inset-0 z-50 flex items-center justify-center">
            <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
        <form hx-post="{% url 'upload_csv' %}"
                hx-indicator="#spinner"
                hx-disabled-elt="find [type='submit']"
                method="post"
                enctype="multipart/form-data">
            {% csrf_token %}
            {% crispy form %}
        </form>
    </div>
</div>
